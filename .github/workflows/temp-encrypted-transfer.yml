name: temp-encrypted-artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted archive
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/tripact_tcasi_overleaf_repo.7z \
            'https://github.com/chanchanman2/imgbed/releases/latest/download/tripact_tcasi_overleaf_repo.7z'
          test -s /tmp/tripact_tcasi_overleaf_repo.7z
      - name: Upload encrypted archive
        uses: actions/upload-artifact@v4
        with:
          name: tripact-overleaf-encrypted
          path: /tmp/tripact_tcasi_overleaf_repo.7z
          retention-days: 1
          if-no-files-found: error
