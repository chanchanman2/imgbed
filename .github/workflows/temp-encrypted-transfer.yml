name: temp-encrypted-artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download protected ZIP
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/tripact_tcasi_overleaf_repo.zip 'https://release-assets.githubusercontent.com/github-production-release-asset/1309862671/a65bb3cc-04fc-40d2-a770-1680f9844732?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-08-24T05%3A02%3A36Z&rscd=attachment%3B+filename%3Dtripact_tcasi_overleaf_repo.zip&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-08-24T04%3A01%3A49Z&ske=2026-08-24T05%3A02%3A36Z&sks=b&skv=2018-11-09&sig=%2B3xiqMGvhWw3Hy6U%2BAX%2FD9VsAW93%2FlzvafjkSQkpqlE%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc4NzU0NTM2NSwibmJmIjoxNzg3NTQ1MDY1LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.iEkIammao1h9rCMepedd2k66FyJSc3WJQN1cECrBCR4&response-content-disposition=attachment%3B%20filename%3Dtripact_tcasi_overleaf_repo.zip&response-content-type=application%2Foctet-stream'
          test -s /tmp/tripact_tcasi_overleaf_repo.zip
      - name: Upload protected ZIP
        uses: actions/upload-artifact@v4
        with:
          name: tripact-overleaf-zipcrypto
          path: /tmp/tripact_tcasi_overleaf_repo.zip
          retention-days: 1
          if-no-files-found: error
